# MySQL datasource
spring.datasource.url=jdbc:mysql://localhost:3306/lifewood_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=root
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Email (Resend API over HTTPS)
app.mail.from=onboarding@resend.dev
app.mail.resend.api-key=${APP_MAIL_RESEND_API_KEY:}
app.mail.resend.api-url=https://api.resend.com/emails
app.mail.resend.connect-timeout-ms=6000
app.mail.resend.read-timeout-ms=12000
app.mail.notification-to=kylequitco3212@gmail.com
app.auth.reset-token-validity-minutes=30
app.auth.reset-token-purge-cron=0 30 3 * * *
app.auth.refresh-token-purge-cron=0 45 3 * * *
app.auth.rate-limit.request-capacity=5
app.auth.rate-limit.window-seconds=60
app.auth.rate-limit.cache-expiry-minutes=10
app.auth.rate-limit.endpoints=/auth/login,/auth/forgot-password,/auth/reset-password,/auth/reset-password/validate
app.frontend.reset-password-url=http://localhost:5173/reset-password

# JPA/Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false