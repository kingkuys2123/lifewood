# MySQL datasource
spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA/Hibernate
spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO:validate}
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

# Email (configure real values in deployment)
spring.mail.host=${SPRING_MAIL_HOST}
spring.mail.port=${SPRING_MAIL_PORT:587}
spring.mail.username=${SPRING_MAIL_USERNAME}
spring.mail.password=${SPRING_MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

app.mail.notification-to=${APP_MAIL_NOTIFICATION_TO}
app.mail.brand.name=${APP_MAIL_BRAND_NAME:Lifewood}
app.mail.brand.website=${APP_MAIL_BRAND_WEBSITE:https://www.lifewood.co\m}

app.auth.reset-token-purge-cron=${APP_AUTH_RESET_TOKEN_PURGE_CRON:0 30 3 * * *}
app.auth.reset-token-validity-minutes=${APP_AUTH_RESET_TOKEN_VALIDITY_MINUTES:30}
app.frontend.reset-password-url=${APP_FRONTEND_RESET_PASSWORD_URL}
app.mail.templates.reset-password-subject=${APP_MAIL_RESET_PASSWORD_SUBJECT:Reset your Lifewood Admin password}
app.mail.templates.reset-password-body=${APP_MAIL_RESET_PASSWORD_BODY:Hello {{name}},\n\nWe received a request to reset your password.\n\nUse this link: {{resetUrl}}\n\nIf you did not request this email, please ignore it.}
