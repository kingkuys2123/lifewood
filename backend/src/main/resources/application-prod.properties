# MySQL datasource
spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.hikari.maximum-pool-size=${SPRING_DATASOURCE_HIKARI_MAXIMUM_POOL_SIZE:12}
spring.datasource.hikari.minimum-idle=${SPRING_DATASOURCE_HIKARI_MINIMUM_IDLE:2}
spring.datasource.hikari.connection-timeout=${SPRING_DATASOURCE_HIKARI_CONNECTION_TIMEOUT_MS:10000}
spring.datasource.hikari.validation-timeout=${SPRING_DATASOURCE_HIKARI_VALIDATION_TIMEOUT_MS:5000}
spring.datasource.hikari.idle-timeout=${SPRING_DATASOURCE_HIKARI_IDLE_TIMEOUT_MS:300000}
spring.datasource.hikari.max-lifetime=${SPRING_DATASOURCE_HIKARI_MAX_LIFETIME_MS:1200000}

# JPA/Hibernate
spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO:validate}
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

# Email - EmailJS Configuration for Production
app.mail.emailjs.service-id=${APP_MAIL_EMAILJS_SERVICE_ID}
app.mail.emailjs.template-id=${APP_MAIL_EMAILJS_TEMPLATE_ID}
app.mail.emailjs.public-key=${APP_MAIL_EMAILJS_PUBLIC_KEY}
app.mail.emailjs.private-key=${APP_MAIL_EMAILJS_PRIVATE_KEY}
app.mail.emailjs.api-url=${APP_MAIL_EMAILJS_API_URL:https://api.emailjs.com/api/v1.0/email/send}
app.mail.notification-to=${APP_MAIL_NOTIFICATION_TO}
app.mail.brand.name=${APP_MAIL_BRAND_NAME:Lifewood}
app.mail.brand.website=${APP_MAIL_BRAND_WEBSITE:https://kingkuys2123-lifewood.vercel.app/}
app.mail.brand.logo-url=${APP_MAIL_BRAND_LOGO_URL:https://i.imgur.com/nBykby2.png}
app.mail.retry.max-attempts=${APP_MAIL_RETRY_MAX_ATTEMPTS:3}
app.mail.retry.initial-delay-ms=${APP_MAIL_RETRY_INITIAL_DELAY_MS:800}
app.mail.async.core-pool-size=${APP_MAIL_ASYNC_CORE_POOL_SIZE:2}
app.mail.async.max-pool-size=${APP_MAIL_ASYNC_MAX_POOL_SIZE:6}
app.mail.async.queue-capacity=${APP_MAIL_ASYNC_QUEUE_CAPACITY:200}

app.auth.reset-token-purge-cron=${APP_AUTH_RESET_TOKEN_PURGE_CRON:0 30 3 * * *}
app.auth.refresh-token-purge-cron=${APP_AUTH_REFRESH_TOKEN_PURGE_CRON:0 45 3 * * *}
app.auth.reset-token-validity-minutes=${APP_AUTH_RESET_TOKEN_VALIDITY_MINUTES:30}
app.auth.rate-limit.request-capacity=${APP_AUTH_RATE_LIMIT_REQUEST_CAPACITY:5}
app.auth.rate-limit.window-seconds=${APP_AUTH_RATE_LIMIT_WINDOW_SECONDS:60}
app.auth.rate-limit.cache-expiry-minutes=${APP_AUTH_RATE_LIMIT_CACHE_EXPIRY_MINUTES:10}
app.auth.rate-limit.endpoints=${APP_AUTH_RATE_LIMIT_ENDPOINTS:/auth/login,/auth/forgot-password,/auth/reset-password,/auth/reset-password/validate}
app.frontend.reset-password-url=${APP_FRONTEND_RESET_PASSWORD_URL}
app.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGINS}

app.ws.allowed-origins=${APP_WS_ALLOWED_ORIGINS}
