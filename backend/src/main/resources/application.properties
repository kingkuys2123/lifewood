spring.application.name=lifewood
server.port=${PORT:8080}

# MySQL datasource
spring.datasource.url=${DATASOURCE_URL:jdbc:mysql://localhost:3306/lifewood_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${DATASOURCE_USERNAME:root}
spring.datasource.password=${DATASOURCE_PASSWORD:root}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA/Hibernate
spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:update}
spring.jpa.show-sql=${JPA_SHOW_SQL:false}
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# Email - EmailJS Configuration (HTTPS-based, works on Railway Free/Trial)
app.mail.emailjs.service-id=${APP_MAIL_EMAILJS_SERVICE_ID:service_k0ie7v9}
app.mail.emailjs.template-id=${APP_MAIL_EMAILJS_TEMPLATE_ID:template_s4lgce9}
app.mail.emailjs.public-key=${APP_MAIL_EMAILJS_PUBLIC_KEY:7KzvyycOYLDTpi2kt}
app.mail.emailjs.private-key=${APP_MAIL_EMAILJS_PRIVATE_KEY:RIZsPRduR3DSaS2cvXBtZ}
app.mail.emailjs.api-url=${APP_MAIL_EMAILJS_API_URL:https://api.emailjs.com/api/v1.0/email/send}
app.mail.notification-to=${APP_MAIL_NOTIFICATION_TO:}
app.mail.retry.max-attempts=${APP_MAIL_RETRY_MAX_ATTEMPTS:3}
app.mail.retry.initial-delay-ms=${APP_MAIL_RETRY_INITIAL_DELAY_MS:800}
app.mail.async.core-pool-size=${APP_MAIL_ASYNC_CORE_POOL_SIZE:2}
app.mail.async.max-pool-size=${APP_MAIL_ASYNC_MAX_POOL_SIZE:6}
app.mail.async.queue-capacity=${APP_MAIL_ASYNC_QUEUE_CAPACITY:200}

# Email Branding
app.mail.brand.name=${APP_MAIL_BRAND_NAME:Lifewood}
app.mail.brand.website=${APP_MAIL_BRAND_WEBSITE:https://www.lifewood.com}

# Multipart upload
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=15MB
app.file.upload-dir=${APP_FILE_UPLOAD_DIR:uploads}
app.applicant.soft-delete-purge-cron=${APP_APPLICANT_SOFT_DELETE_PURGE_CRON:0 0 3 * * *}

# JWT
app.jwt.secret=${APP_JWT_SECRET:change-me-in-env}
app.jwt.access-token-validity-ms=${APP_JWT_ACCESS_TOKEN_VALIDITY_MS:3600000}
app.jwt.refresh-token-validity-ms=${APP_JWT_REFRESH_TOKEN_VALIDITY_MS:604800000}

# Reset Password
app.auth.reset-token-validity-minutes=${APP_AUTH_RESET_TOKEN_VALIDITY_MINUTES:30}
app.auth.reset-token-purge-cron=${APP_AUTH_RESET_TOKEN_PURGE_CRON:0 30 3 * * *}
app.auth.refresh-token-purge-cron=${APP_AUTH_REFRESH_TOKEN_PURGE_CRON:0 45 3 * * *}
app.auth.rate-limit.request-capacity=${APP_AUTH_RATE_LIMIT_REQUEST_CAPACITY:5}
app.auth.rate-limit.window-seconds=${APP_AUTH_RATE_LIMIT_WINDOW_SECONDS:60}
app.auth.rate-limit.cache-expiry-minutes=${APP_AUTH_RATE_LIMIT_CACHE_EXPIRY_MINUTES:10}
app.auth.rate-limit.endpoints=${APP_AUTH_RATE_LIMIT_ENDPOINTS:/auth/login,/auth/forgot-password,/auth/reset-password,/auth/reset-password/validate}
app.frontend.reset-password-url=${APP_FRONTEND_RESET_PASSWORD_URL:http://localhost:5173/reset-password}


# Allowed Origins
app.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGINS:http://localhost:5173}
app.ws.allowed-origins=${APP_WS_ALLOWED_ORIGINS:http://localhost:5173}

# API docs
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html

# Pageable defaults
spring.data.web.pageable.default-page-size=10
spring.data.web.pageable.max-page-size=100
