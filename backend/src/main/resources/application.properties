spring.application.name=lifewood
server.port=${PORT:8080}

# MySQL datasource
spring.datasource.url=${DATASOURCE_URL:jdbc:mysql://localhost:3306/lifewood_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${DATASOURCE_USERNAME:root}
spring.datasource.password=${DATASOURCE_PASSWORD:root}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA/Hibernate
spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:update}
spring.jpa.show-sql=${JPA_SHOW_SQL:false}
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# Email
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:kylequitco3212@gmail.com}
spring.mail.password=${MAIL_PASSWORD:xtqyzulcrwpnfghp}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
app.mail.notification-to=${NOTIFICATION_EMAIL:kylequitco3212@gmail.com}

# Multipart upload
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=15MB
app.file.upload-dir=${APP_FILE_UPLOAD_DIR:uploads}
app.applicant.soft-delete-purge-cron=${APP_APPLICANT_SOFT_DELETE_PURGE_CRON:0 0 3 * * *}

# JWT
app.jwt.secret=${APP_JWT_SECRET:AtbBJF4wnamzV4FPwIiodGzOPqkYuDRhxeXkSU9Z4zd}
app.jwt.access-token-validity-ms=${APP_JWT_ACCESS_TOKEN_VALIDITY_MS:3600000}
app.jwt.refresh-token-validity-ms=${APP_JWT_REFRESH_TOKEN_VALIDITY_MS:604800000}

# Reset Password
app.auth.reset-token-validity-minutes=${APP_AUTH_RESET_TOKEN_VALIDITY_MINUTES:30}
app.auth.reset-token-purge-cron=${APP_AUTH_RESET_TOKEN_PURGE_CRON:0 30 3 * * *}
app.auth.rate-limit.request-capacity=${APP_AUTH_RATE_LIMIT_REQUEST_CAPACITY:5}
app.auth.rate-limit.window-seconds=${APP_AUTH_RATE_LIMIT_WINDOW_SECONDS:60}
app.auth.rate-limit.cache-expiry-minutes=${APP_AUTH_RATE_LIMIT_CACHE_EXPIRY_MINUTES:10}
app.auth.rate-limit.endpoints=${APP_AUTH_RATE_LIMIT_ENDPOINTS:/auth/login,/auth/forgot-password,/auth/reset-password,/auth/reset-password/validate}
app.frontend.reset-password-url=${APP_FRONTEND_RESET_PASSWORD_URL:http://localhost:5173/reset-password}

# Email templates
app.mail.templates.reset-password-subject=${APP_MAIL_RESET_PASSWORD_SUBJECT:Reset your Lifewood Admin password}
app.mail.templates.reset-password-body=${APP_MAIL_RESET_PASSWORD_BODY:Hello {{name}},\n\nWe received a request to reset your password.\n\nUse this link: {{resetUrl}}\n\nIf you did not request this, please ignore this email.}

# Allowed Origins
app.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGINS:http://localhost:5173}
app.ws.allowed-origins=${APP_WS_ALLOWED_ORIGINS:http://localhost:5173}

# API docs
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html

# Pageable defaults
spring.data.web.pageable.default-page-size=10
spring.data.web.pageable.max-page-size=100
