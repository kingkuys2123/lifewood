spring.application.name=lifewood

server.port=8080

# MySQL datasource
spring.datasource.url=jdbc:mysql://localhost:3306/lifewood_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=root
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA/Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# Multipart upload
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=15MB
app.file.upload-dir=uploads

# JWT
app.jwt.secret=ReplaceWithAtLeast256BitSecretKeyReplaceWithAtLeast256BitSecretKey
app.jwt.access-token-validity-ms=3600000
app.jwt.refresh-token-validity-ms=604800000

# Email (configure real values in deployment)
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=your-email@example.com
spring.mail.password=your-app-password
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
app.mail.notification-to=hr@lifewood.com

# API docs
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html

# Pageable defaults
spring.data.web.pageable.default-page-size=10
spring.data.web.pageable.max-page-size=100

